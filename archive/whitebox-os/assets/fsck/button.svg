<svg xmlns="http://www.w3.org/2000/svg" width="220" height="48" aria-label="DO NOT PRESS" role="img" viewBox="0 0 220 48"><title>DO NOT PRESS</title><style>@keyframes phblink{0%,49%{opacity:1}50%{opacity:0}}@keyframes fsled{0%{opacity:1}50%{opacity:.35}}text{font-family:ui-monospace,SFMono-Regular,&apos;SF Mono&apos;,Menlo,Consolas,&apos;Liberation Mono&apos;,monospace}.fg{fill:#f0f6fc}.ink{fill:#0d1117}.warn{fill:#ffb000}.key{fill:#21262d}.khi{fill:#3d444d}.klo{fill:#010409}.glow{filter:url(#phglow)}.led{animation:fsled 2.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="phglow" width="140%" height="180%" x="-20%" y="-40%"><feGaussianBlur result="b" stdDeviation="2.2"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="hz" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="5" height="10" class="warn"/><rect width="5" height="10" x="5" class="ink"/></pattern></defs><rect width="220" height="48" fill="url(#hz)" rx="6"/><rect width="208" height="36" x="6" y="6" class="klo" rx="4"/><rect width="208" height="33" x="6" y="6" class="khi" rx="4"/><rect width="208" height="32" x="6" y="7" class="key" rx="4"/><g class="glow"><circle cx="23" cy="23" r="3.5" class="warn led"/></g><text x="118" y="28.2" class="fg" font-size="15" font-weight="700" lengthAdjust="spacing" text-anchor="middle" textLength="108" xml:space="preserve">DO NOT PRESS</text></svg>