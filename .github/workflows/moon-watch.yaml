name: Moon watch

# Once a week, on Saturday: if Bill pushed again to a repo in the Now
# section, its date moves forward (no LLM, no new lines), and the terminal
# card is redrawn. It commits only when a date
# moved. The Saturday cadence is also part of the repo's keepalive (GitHub
# disables cron workflows after 60 quiet days); do not thin it.

on:
  schedule:
    - cron: "41 14 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-writes
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib only. Any API failure warns and changes nothing.
      - name: Move the Now dates forward
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_currently_building.py --dates-only

      - name: Redraw the terminal card
        run: python scripts/generate_ansi_card.py

      - name: Rebase on latest main
        run: git pull --rebase --autostash origin main

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Move the Now dates forward (moon watch)"
          # Every pathspec must exist, or git add fails and nothing commits.
          file_pattern: "README.md assets/status.json bill.ansi"
